[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfuture"
version = "0.4.1"
description = "Evidence-grounded research trajectories and API-only conditional idea exploration"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
paperfuture = "paperfuture.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["farfield*", "paperfuture*"]
